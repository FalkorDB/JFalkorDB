name: API diff

# PR-only public-API compatibility gate (japicmp): fails on binary/source-incompatible changes to the
# published API vs the last release on Maven Central. A reviewed, intentional break is approved by
# adding the `breaking-change` label to the PR — hence the `labeled`/`unlabeled` triggers, so
# adding/removing the label re-runs the gate without needing a new commit. This lives in its own
# workflow (not a `Java CI with Maven` job) so label toggles don't needlessly re-run the whole
# build/test matrix. Runs only on PRs: a reviewed break is approved per-PR via the label, so the
# post-merge master push (which has no PR label) would re-flag an already approved break; direct
# pushes to master are disallowed, so PR coverage is sufficient.
#
# Two more steps cover what japicmp can't see (members inherited from Jedis, and the Jedis types our
# signatures return): `just api-surface` checks the committed api/jfalkordb.api still matches the
# code, and `just api-surface-breaks` fails when the PR removes or changes a line of it, which the
# `breaking-change` label approves just like a japicmp finding.

on:
  pull_request:
    branches: [ "master" ]
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: api-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-diff:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        # Full history, so `just api-surface-breaks` can read the base branch's api/jfalkordb.api.
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
    - name: Public-API compatibility diff vs the last release (via just)
      # Fails on binary/source-incompatible PUBLIC/PROTECTED-API changes vs the last release on Maven
      # Central. Approve a reviewed, intentional break by adding the `breaking-change` label to the PR,
      # which flips the japicmp gate to non-failing for this run.
      run: just api-diff ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') && '-Dapi.diff.fail=false' || '' }}
    - name: Full public-API surface snapshot, inherited Jedis members included (via just)
      # japicmp only compares the classes in our jar, so it can't see a dependency bump change the
      # thousand-odd methods GraphPipeline/GraphTransaction each inherit from Jedis, or the Jedis type
      # Driver.getConnection() returns. This checks them against the committed api/jfalkordb.api.
      # Runs even when the japicmp step failed, so every report shows. A mismatch is fixed by
      # committing `just api-surface-update`'s output, never by a label.
      if: ${{ !cancelled() }}
      run: just api-surface
    - name: Breaking changes in the API surface snapshot vs the base branch (via just)
      # A removed or changed line of api/jfalkordb.api is a break callers see, even when it comes from
      # a dependency bump; like japicmp's findings it needs the `breaking-change` label (and so a `!`
      # title). The base ref goes through env, not the script text.
      if: ${{ !cancelled() }}
      env:
        BASE_REF: ${{ github.base_ref }}
      run: just api-surface-breaks "origin/$BASE_REF" ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') && 'allow' || '' }}
