name: Virtual-thread pinning check

# Wave 5 (Project Loom): verifies the blocking client does not pin carrier threads when driven from
# virtual threads on JDK 21+. It warms the connection pool (so cold commons-pool2 connection creation
# runs off the measured path), then runs a virtual-thread query workload over the warm pool under a JFR
# recording, with -Djdk.tracePinnedThreads=full marking which frames hold the monitor on each pinned
# stack. It fails if one of them is in our com.falkordb.impl client internals; pins whose monitor a
# dependency holds (commons-pool2 2.13+ returning a connection under contention) are reported, not failed.
# Virtual-thread load timing is runner-sensitive, so this runs on a schedule (and on demand) rather
# than as a per-PR gate, plus on PRs that change the check itself. See `just pin-check`.

on:
  schedule:
    - cron: '0 5 * * 1' # weekly, Mondays 05:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'pin-check/**'
      - '.github/workflows/pin-check.yml'
      - 'Justfile'
      # The check installs the root project first, so a dependency change (such as the Jedis 8 bump
      # that brought in commons-pool2 2.13) runs it too.
      - 'pom.xml'

permissions:
  contents: read

concurrency:
  group: pin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-check:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
    # Starts a Testcontainers FalkorDB (Docker is available on ubuntu-latest); no FALKORDB_HOST needed.
    - name: Virtual-thread pinning check (via just)
      run: just pin-check
