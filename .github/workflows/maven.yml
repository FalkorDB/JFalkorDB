# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      falkordb_image_tag:
        description: "FalkorDB Docker image tag the `6` leg of the server matrix runs against (defaults to the newest 6.x release)"
        required: false
        default: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
    # Resolve every plugin and dependency up front, with the retries from .mvn/maven.config, so a
    # transient Maven Central error fails here (cheap, retryable) rather than midway through the build.
    - name: Warm Maven cache (via just)
      run: just fetch-deps
    - name: Build & test (via just)
      run: just verify

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Maven Dependency Tree Dependency Submission
      if: github.token.permissions.contents == 'write'
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1

  # Server matrix: the required `build`/`smoke-*` jobs pin a digest (v4.20.1, the minimum supported
  # version) and speak RESP2, so nothing there would notice a break against the newest 4.x or 6.x
  # release, against 6.0.x (the 6.x line without SCHEMA_HASH), or over RESP3. Each leg runs the same
  # `just verify` suite: `just falkordb-image` resolves the line to its newest release, and
  # FALKORDB_PROTOCOL picks the protocol the suite's drivers speak. min/resp2 is `build` itself. The
  # daily `version-canary` workflow covers `edge` and `latest`. `workflow_dispatch` can point the `6`
  # leg at another tag with `falkordb_image_tag`.
  verify-servers:

    name: verify (${{ matrix.line }}, ${{ matrix.protocol }})

    runs-on: ubuntu-latest

    strategy:
      # a failure on one leg must not cancel, and so hide, the others
      fail-fast: false
      matrix:
        line: ['min', '4', '6.0', '6']
        protocol: ['resp2', 'resp3']
        exclude:
          - line: 'min'
            protocol: 'resp2'

    env:
      FALKORDB_LINE: ${{ matrix.line }}
      FALKORDB_PROTOCOL: ${{ matrix.protocol }}
      DISPATCH_TAG: ${{ github.event.inputs.falkordb_image_tag }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
    - name: Test the image resolver (via just)
      if: matrix.line == 'min' && matrix.protocol == 'resp3'
      run: just falkordb-image-test
    # FALKORDB_IMAGE is read by the TestServer harness (FalkorDbImage.resolve); empty means the pinned
    # default digest. A dispatched tag other than `latest` replaces the `6` leg's image.
    # The server's graph module version is printed by the suite itself ("[TestServer] ...").
    - name: Resolve the FalkorDB image (via just)
      run: |
        if [ "$FALKORDB_LINE" = 6 ] && [ -n "$DISPATCH_TAG" ] && [ "$DISPATCH_TAG" != latest ]; then
          if ! [[ "$DISPATCH_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::falkordb_image_tag is not a Docker tag: $DISPATCH_TAG"
            exit 1
          fi
          image="falkordb/falkordb:$DISPATCH_TAG"
        else
          image="$(just falkordb-image "$FALKORDB_LINE" 2> resolve.err)"
          # a Docker Hub outage falls back to a pinned tag: make that visible on the run's summary
          if [ -s resolve.err ]; then
            echo "::warning::$(tr '\n' ' ' < resolve.err)"
          fi
        fi
        echo "FALKORDB_IMAGE=$image" >> "$GITHUB_ENV"
        echo "line=$FALKORDB_LINE image=${image:-the pinned default} protocol=$FALKORDB_PROTOCOL"
    # Resolve every plugin and dependency up front, with the retries from .mvn/maven.config, so a
    # transient Maven Central error fails here (cheap, retryable) rather than midway through the build.
    - name: Warm Maven cache (via just)
      run: just fetch-deps
    - name: Build & test (via just)
      run: just verify

  format:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
    - name: Warm Maven cache (via just)
      run: just fetch-deps -Pquality
    - name: Check formatting (via just)
      run: just fmt-check

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
    - name: Warm Maven cache (via just)
      run: just fetch-deps -Pquality
    - name: Static analysis — SpotBugs/FindSecBugs + Error Prone (via just)
      run: just lint

  javadoc:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
    - name: Warm Maven cache (via just)
      run: just fetch-deps -Pquality
    - name: Javadoc gate — strict doclint on the public API (via just)
      run: just javadoc

  # Compile the standalone runnable examples (examples/) with release 8 against the built jar, so the
  # documented examples can't silently drift from the public API. Compile-only — no server needed.
  examples:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
    - name: Warm Maven cache (via just)
      run: just fetch-deps
    - name: Compile the runnable examples (via just)
      run: just examples

  smoke-jdk8:

    runs-on: ubuntu-latest

    # Pinned FalkorDB (v4.20.1) so this required Java-8 runtime check can't be broken by an
    # upstream image change; edge/version-matrix canaries arrive in a later wave.
    services:
      falkordb:
        image: falkordb/falkordb@sha256:9042fdc4e53f5390ca5a3993aa71506523970efb40ffb9a98e6a4b1a9a4f8862
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK 21 (build) and JDK 8 (runtime)
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: |
          8
          21
        distribution: 'temurin'
        cache: maven
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
    - name: Warm Maven cache (via just)
      run: just fetch-deps
    - name: Build on JDK 21, run the packaged-artifact smoke on JDK 8 (via just)
      run: just verify-jdk8 "$JAVA_HOME_8_X64"

  # JDK runtime matrix: prove the packaged Java-8 artifact also loads and runs on newer JDKs (the
  # runtime guarantee the compile-time guards can't give). JDK 8 stays in the required `smoke-jdk8`
  # job above (kept for its branch-protection context); once branch protection requires this matrix,
  # 8 can be folded in and `smoke-jdk8` retired.
  smoke-jdk:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        jdk: ['11', '17', '21']

    # Same pinned FalkorDB (v4.20.1) as smoke-jdk8, so a runtime regression is isolated from image drift.
    services:
      falkordb:
        image: falkordb/falkordb@sha256:9042fdc4e53f5390ca5a3993aa71506523970efb40ffb9a98e6a4b1a9a4f8862
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up JDK ${{ matrix.jdk }} (runtime) and JDK 21 (build)
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: |
          ${{ matrix.jdk }}
          21
        distribution: 'temurin'
        cache: maven
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
    - name: Warm Maven cache (via just)
      run: just fetch-deps
    - name: Build on JDK 21, run the packaged-artifact smoke on JDK ${{ matrix.jdk }} (via just)
      run: just verify-jdk "$JAVA_HOME_${{ matrix.jdk }}_X64"
